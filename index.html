<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Scouter v6 — live map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" onerror="window.__leafletFailed = true"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0f1418; color: #e6e9ec; font: 14px/1.35 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #hud { padding: 6px 10px; background: #161d23; border-bottom: 1px solid #263039; }
  #hud .region { font-size: 17px; font-weight: 600; }
  #hud .line { font-size: 12.5px; color: #b7c0c8; margin-top: 1px; }
  #hud .line b { color: #fff; font-weight: 600; }
  #arena { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #osm { position: absolute; inset: 0; background: #0f1418; }
  #osm.hidden, #map.hidden { display: none; }
  .leaflet-container { background: #1a2128; font: inherit; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(15,20,24,.7) !important; color: #9aa6b0 !important; }
  .leaflet-control-attribution a { color: #bcd !important; }
  #flash { position: absolute; left: 10px; right: 10px; top: 60px; background: rgba(29,38,46,.95); border: 1px solid #34424d; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; z-index: 1000; }
  #flash.show { display: block; }
  #gpsBig { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000; display: none; background: #2b6a49; border-color: #3f9a6a; }
  #gpsBig.show { display: block; }
  #centerBtn { position: absolute; right: 10px; bottom: 10px; z-index: 1000; min-height: 36px; padding: 0 10px; font-size: 12px; display: none; }
  #centerBtn.show { display: block; }
  .pad.hidden { display: none; }
  #gymBtn { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 1000; display: none; background: #2b6a49; border-color: #3f9a6a; }
  #gymBtn.show { display: block; }
  #gymBtn.locked { background: #4a3a2a; border-color: #7a5a3a; }
  #toast { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1001; background: #1d262e; border: 1px solid #34424d; border-radius: 10px; padding: 9px 10px; display: none; max-height: 92%; overflow-y: auto; }
  #toast.show { display: block; }
  #toast::after { content: ""; display: block; clear: both; }
  #toast .sp { font-size: 15px; font-weight: 600; }
  #toast .meta { color: #b7c0c8; font-size: 12.5px; margin-top: 3px; }
  #toast .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; clear: both; }
  #toast .acts button { flex: 1 1 30%; min-height: 40px; font-size: 13px; }
  #toast .row2 { display: grid; grid-template-columns: 1fr 90px 60px; gap: 6px; align-items: center; margin: 3px 0; }
  #toast img.foe { float: right; width: 72px; height: 72px; image-rendering: pixelated; margin-left: 8px; object-fit: contain; }

  .hpb { height: 8px; background: #2a343d; border-radius: 4px; overflow: hidden; } .hpf { height: 100%; }

  #panel .ph2 { font-weight: 600; margin: 8px 0 4px; color: #b7c0c8; }
  .mon { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #222c34; }
  .mon img, .mon .ph { width: 40px; height: 40px; image-rendering: pixelated; background: #1d262e; border-radius: 6px; flex: 0 0 40px; object-fit: contain; }
  .mon .nm { flex: 1; } .mon small { color: #8f9aa4; } .mon button { min-height: 36px; padding: 0 10px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: #1d262e; border: 1px solid #34424d; border-radius: 8px; padding: 4px 8px; margin: 3px 4px 3px 0; font-size: 12.5px; }
  .badge img { width: 22px; height: 22px; image-rendering: pixelated; }

  #bar .stack.wide { grid-column: 1 / -1; flex-direction: row; } #bar .stack.wide button { flex: 1; }

  .stack { display: flex; flex-direction: column; gap: 6px; justify-content: center; }

  button:active { background: #33434f; }

<body>
<div id="app">
  <div id="hud">

    <button id="centerBtn">⌖ Centre on me</button>
    <div id="toast"><img id="tImg" class="foe" alt="" style="display:none"><div class="sp" id="tSp"></div><div class="meta" id="tMeta"></div><div class="acts" id="tActs"></div></div>
    <div id="panel">
      <div class="ph2">Team <button id="heal" style="float:right;min-height:32px;padding:0 10px">Heal all (free, stub)</button></div><div id="pTeam"></div>
      <div class="ph2">Box</div><div id="pBox"></div>

    <div class="pad hidden" id="pad">
      <button class="hidden"></button><button data-d="n">▲</button><button class="hidden"></button>
      <button data-d="w">◀</button><button id="speed">walk</button><button data-d="e">▶</button>
      <button class="hidden"></button><button data-d="s">▼</button><button class="hidden"></button>
    </div>
    <div class="stack" id="stack">
      <button id="scan">Scan route</button>
      <button id="team">Team</button>
      <button id="zoom">Region view</button>
    </div>
    <div class="row">
      <button id="viewMode">Map</button>
      <button id="squares">Squares: on</button>
      <button id="gps">Live GPS</button>
    </div>
    <div class="row">
      <button id="loadBin">Load .bin</button>
      <button id="load">Load folder</button>
      <button id="reset">Reset</button>
      <input id="packFiles" type="file" multiple style="display:none" webkitdirectory>
      <input id="packBin" type="file" style="display:none">
    </div>
    <div id="note">Pack: <span id="packName">demo fixture</span>. Map tiles © OpenStreetMap contributors. Balance is a stub.</div>
  </div>
  </div>
</div>

<script>
/* CORE-START */
// ===== Tunables (world scale) =====
// ASSUMPTION: the original app's scale is unknown; these are starting guesses for the phone playtest.
const WORLD = {
  SEED: 20260903,
  LAT_STEP: 0.003,   // one route ≈ 334 m north–south
  LON_STEP: 0.004,   // one route ≈ 323 m east–west at 43.5°N
  MACRO: 4,          // routes per macro-area side  → macro-area ≈ 1.3 km square
  REGION: 3,         // macro-areas per region side → region ≈ 4 km square, 9 macro-areas, centre = league
  LEGENDARY_MIN_BADGES: 6,
  LEGENDARY_ODDS: 512,
};
// ===== Gym tunables =====
const GYM = {
  BASE_LEVEL: 8, PER_BADGE: 5,          // leader level = 8 + 5 × total badges (rematches scale with you)
  ACE_BONUS: 3,                         // ace sits above the rest of the team
  TEAM_MIN: 2, BADGES_PER_SLOT: 2,      // team size = 2 + badges/2, capped at 6
  LEAGUE_BASE: 45, LEAGUE_PER_BADGE: 3, // champion level
  REGION_BADGES_FOR_LEAGUE: 8,
};

// ===== Deterministic hashing =====
function hash32(...ints) {
  let h = 0x9e3779b9 ^ WORLD.SEED;
  for (const v of ints) {
    let x = (v | 0) * 0x27d4eb2d;
    x ^= x >>> 15; x = Math.imul(x, 0x85ebca6b); x ^= x >>> 13;
    h ^= x; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  }
  return h >>> 0;
}
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function floorDiv(a, b) { return Math.floor(a / b); }
function mod(a, b) { return ((a % b) + b) % b; }
function weightedPick(cum, r) { // cum: cumulative weights; r in [0,1)
  const x = r * cum[cum.length - 1];
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] > x) hi = mid; else lo = mid + 1; }
  return lo;
}

// ===== Geometry =====
function routeCell(lat, lon) { return { rx: Math.floor(lon / WORLD.LON_STEP), ry: Math.floor(lat / WORLD.LAT_STEP) }; }
function cellBounds(rx, ry) { return { lat0: ry * WORLD.LAT_STEP, lat1: (ry + 1) * WORLD.LAT_STEP, lon0: rx * WORLD.LON_STEP, lon1: (rx + 1) * WORLD.LON_STEP }; }
function cellCenter(rx, ry) { return { lat: (ry + 0.5) * WORLD.LAT_STEP, lon: (rx + 0.5) * WORLD.LON_STEP }; }
function macroOf(rx, ry) { return { mx: floorDiv(rx, WORLD.MACRO), my: floorDiv(ry, WORLD.MACRO) }; }
function regionOf(mx, my) { return { gx: floorDiv(mx, WORLD.REGION), gy: floorDiv(my, WORLD.REGION) }; }
function macroIndex(mx, my) { return mod(mx, WORLD.REGION) + WORLD.REGION * mod(my, WORLD.REGION); }
const LEAGUE_INDEX = Math.floor((WORLD.REGION * WORLD.REGION) / 2);
function routeNumber(rx, ry) { const side = WORLD.MACRO * WORLD.REGION; return mod(rx, side) + side * mod(ry, side) + 1; }
function regionKey(gx, gy) { return gx + ',' + gy; }
function haversineM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (lat2 - lat1) * toR, dLon = (lon2 - lon1) * toR;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function bearingDeg(lat1, lon1, lat2, lon2) {
  const toR = Math.PI / 180, y = Math.sin((lon2 - lon1) * toR) * Math.cos(lat2 * toR);
  const x = Math.cos(lat1 * toR) * Math.sin(lat2 * toR) - Math.sin(lat1 * toR) * Math.cos(lat2 * toR) * Math.cos((lon2 - lon1) * toR);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function compass(deg) { return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8]; }

// ===== Region names =====
const NAME_BLOCKLIST = ['kanto', 'johto', 'hoenn', 'sinnoh', 'unova', 'kalos', 'alola', 'galar', 'paldea', 'hisui', 'orre', 'fiore', 'almia', 'oblivia', 'ransei', 'lental', 'kitakami'];
const SYL_A = ['Kan', 'Jo', 'Ho', 'Sin', 'Un', 'Kal', 'Al', 'Pal', 'Gal', 'Hi', 'Ve', 'Or', 'Tem', 'Ash', 'Mar', 'Rin', 'Sol', 'Var', 'Ny', 'Tor', 'Bel', 'Cor', 'Del', 'Fen', 'Lu', 'Mi', 'Sa', 'Ta'];
const SYL_B = ['ra', 'lo', 'na', 'vi', 'te', 'ki', 'mo', 'su', 'ri', 'da', 'ne', 'go'];
const SYL_C = ['to', 'en', 'oh', 'ar', 'os', 'dea', 'ia', 'ova', 'um', 'or', 'is', 'ai', 'ul', 'ith', 'an'];
function regionName(gx, gy) {
  const n = PACK.naming;
  const A = n ? n.prefixes : SYL_A, B = n ? (n.middles || []) : SYL_B, C = n ? n.suffixes : SYL_C;
  const block = (n ? (n.blocklist || []) : NAME_BLOCKLIST).map(x => x.toLowerCase());
  const r = rng(hash32(gx, gy, 101));
  for (let attempt = 0; attempt < 20; attempt++) {
    const three = B.length > 0 && r() < 0.4;
    let name = A[Math.floor(r() * A.length)];
    if (three) name += B[Math.floor(r() * B.length)];
    name += C[Math.floor(r() * C.length)];
    if (!block.includes(name.toLowerCase())) return name;
  }
  return 'Region ' + gx + ',' + gy;
}

// ===== Pack model =====
// Two on-disk formats load into one compiled model:
//   scouter-pack/1  (this project's JSON schema; supports battle.mode "light" or "full")
//   GMS .bin        (Tankenka's GPS Monster Scouter pack: JSON + base64 images + trailing signature; always light mode)
// Compiled PACK: { meta, source, mode, types, typeChart, movesById, speciesById, habitats, rares, gyms, images, naming, keywords }
//   habitats: route population pools  [{ id, name, color, types:Set, members:[{id,min,max}], diffusion }]
//   gyms:     gym/badge pool (≥ 8)     [{ id, name, color, type, leaders:[names], leaderImages:[names], badges:[{name,icon}] }]
//   rares:    per-route rare pools     [{ id, name, members:[{id,minlvl}] }]

const DEMO_PACK = { // engine test fixture only — not a roster
  format: 'scouter-pack/1', name: 'Demo fixture', author: 'engine', version: '1',
  families: ['Ember', 'Tide', 'Bloom', 'Spark', 'Frost', 'Stone', 'Gale', 'Venom', 'Psyche', 'Shade', 'Iron', 'Fae'].map((n, i) => ({ id: n.toLowerCase(), name: n, color: ['#e0603a', '#3a8fe0', '#5cbf4a', '#e8c33a', '#8fd6ee', '#a58a66', '#b9c7d6', '#a05cd6', '#ee7ac8', '#5a5f7a', '#8c98a4', '#f4a6c6'][i] })),
  species: [],
  leaders: ['Adaora', 'Bashir', 'Cato', 'Dilnaz', 'Emeric', 'Farah', 'Gulzar', 'Hiro', 'Ilse', 'Jamal', 'Kenji', 'Laila', 'Mattias', 'Noor', 'Orla', 'Pavel', 'Qasim', 'Rania', 'Soren', 'Tariq'],
};
DEMO_PACK.families.forEach(f => { for (let st = 1; st <= 3; st++) DEMO_PACK.species.push({ id: f.id + st, name: f.name + ' ' + 'I II III'.split(' ')[st - 1], family: f.id, stage: st, evolvesTo: st < 3 ? [f.id + (st + 1)] : [], evolveLevel: st < 3 ? 14 + 16 * (st - 1) : null, sprite: null, legendary: false }); });
DEMO_PACK.species.push({ id: 'leg1', name: 'Demo Legend', family: 'psyche', stage: 3, evolvesTo: [], evolveLevel: null, sprite: null, legendary: true });

const DEFAULT_LEADERS = ['Leader'];
function validatePack(p) {
  const errors = [];
  if (!p || typeof p !== 'object') return { ok: false, errors: ['pack is not an object'] };
  if (p.format !== 'scouter-pack/1') errors.push('format must be "scouter-pack/1"');
  if (!Array.isArray(p.families) || p.families.length < 8) errors.push('families: need at least 8');
  const famIds = new Set();
  (p.families || []).forEach((f, i) => {
    if (!f || typeof f.id !== 'string' || !f.id) errors.push('families[' + i + ']: missing id');
    else if (famIds.has(f.id)) errors.push('families: duplicate id "' + f.id + '"'); else famIds.add(f.id);
    if (!f || typeof f.name !== 'string') errors.push('families[' + i + ']: missing name');
    if (!f || !/^#[0-9a-fA-F]{6}$/.test(f.color || '')) errors.push('families[' + i + ']: color must be #rrggbb');
  });
  if (!Array.isArray(p.species) || p.species.length === 0) errors.push('species: need at least 1');
  const spIds = new Set(); const stage1ByFam = new Map();
  (p.species || []).forEach((s, i) => {
    if (!s || typeof s.id !== 'string' || !s.id) { errors.push('species[' + i + ']: missing id'); return; }
    if (spIds.has(s.id)) errors.push('species: duplicate id "' + s.id + '"'); else spIds.add(s.id);
    if (typeof s.name !== 'string') errors.push('species ' + s.id + ': missing name');
    if (!famIds.has(s.family)) errors.push('species ' + s.id + ': unknown family "' + s.family + '"');
    if (![1, 2, 3].includes(s.stage)) errors.push('species ' + s.id + ': stage must be 1, 2 or 3');
    if (s.stage === 1 && !s.legendary) stage1ByFam.set(s.family, (stage1ByFam.get(s.family) || 0) + 1);
    if (s.sprite != null && typeof s.sprite !== 'string') errors.push('species ' + s.id + ': sprite must be a filename or null');
  });
  (p.species || []).forEach(s => (s && Array.isArray(s.evolvesTo) ? s.evolvesTo : []).forEach(t => { if (!spIds.has(t)) errors.push('species ' + s.id + ': evolvesTo unknown id "' + t + '"'); }));
  famIds.forEach(id => { if (!stage1ByFam.get(id)) errors.push('family "' + id + '": needs at least one non-legendary stage-1 species'); });
  if (p.naming) for (const k of ['prefixes', 'suffixes']) if (!Array.isArray(p.naming[k]) || p.naming[k].length < 4) errors.push('naming.' + k + ': need at least 4 syllables');
  const mode = (p.battle && p.battle.mode) || 'light';
  if (!['light', 'full'].includes(mode)) errors.push('battle.mode must be "light" or "full"');
  if (mode === 'full') {
    const typeIds = new Set();
    if (!Array.isArray(p.types) || p.types.length < 2) errors.push('full battle: types: need at least 2');
    (p.types || []).forEach((t, i) => { if (!t || typeof t.id !== 'string') errors.push('types[' + i + ']: missing id'); else typeIds.add(t.id); });
    if (!p.typeChart || typeof p.typeChart !== 'object') errors.push('full battle: typeChart required');
    else for (const [atk, row] of Object.entries(p.typeChart)) {
      if (!typeIds.has(atk)) errors.push('typeChart: unknown attacking type "' + atk + '"');
      for (const [def, mult] of Object.entries(row || {})) { if (!typeIds.has(def)) errors.push('typeChart.' + atk + ': unknown defending type "' + def + '"'); if (typeof mult !== 'number' || mult < 0) errors.push('typeChart.' + atk + '.' + def + ': multiplier must be a number ≥ 0'); }
    }
    const moveIds = new Set(); const damaging = new Set();
    if (!Array.isArray(p.moves) || p.moves.length === 0) errors.push('full battle: moves: need at least 1');
    (p.moves || []).forEach((m, i) => {
      if (!m || typeof m.id !== 'string') { errors.push('moves[' + i + ']: missing id'); return; }
      if (moveIds.has(m.id)) errors.push('moves: duplicate id "' + m.id + '"'); moveIds.add(m.id);
      if (!typeIds.has(m.type)) errors.push('move ' + m.id + ': unknown type "' + m.type + '"');
      if (!['physical', 'special', 'status'].includes(m.category)) errors.push('move ' + m.id + ': category must be physical, special or status');
      if (m.category !== 'status') { if (!(m.power > 0)) errors.push('move ' + m.id + ': damaging move needs power > 0'); else damaging.add(m.id); }
      if (m.accuracy != null && !(m.accuracy > 0 && m.accuracy <= 100)) errors.push('move ' + m.id + ': accuracy must be 1..100 or null (never misses)');
      if (!(m.pp > 0)) errors.push('move ' + m.id + ': pp must be > 0');
    });
    (p.species || []).forEach(sp => {
      if (!sp || typeof sp.id !== 'string') return;
      if (!Array.isArray(sp.types) || sp.types.length < 1 || sp.types.length > 2 || !sp.types.every(t => typeIds.has(t))) errors.push('species ' + sp.id + ': types must be 1–2 known type ids');
      const st = sp.stats || {};
      for (const k of ['hp', 'atk', 'def', 'spa', 'spd', 'spe']) if (!(Number.isInteger(st[k]) && st[k] > 0)) errors.push('species ' + sp.id + ': stats.' + k + ' must be a positive integer');
      if (!Array.isArray(sp.learnset) || !sp.learnset.length) { errors.push('species ' + sp.id + ': learnset required'); return; }
      let earlyDamaging = false;
      sp.learnset.forEach(l => { if (!l || !moveIds.has(l.move)) errors.push('species ' + sp.id + ': learnset unknown move "' + (l && l.move) + '"'); else if (!(Number.isInteger(l.level) && l.level >= 1)) errors.push('species ' + sp.id + ': learnset level must be ≥ 1'); else if (l.level <= 5 && damaging.has(l.move)) earlyDamaging = true; });
      if (!earlyDamaging) errors.push('species ' + sp.id + ': needs a damaging move learnable by level 5');
    });
  }
  return { ok: errors.length === 0, errors };
}
function isGmsPack(p) { return !!(p && typeof p === 'object' && typeof p.packName === 'string' && p.data && p.data.monsters && p.data.families); }
function validateGmsPack(p) {
  const errors = [];
  if (!isGmsPack(p)) return { ok: false, errors: ['not a GMS pack (needs packName + data.monsters + data.families)'] };
  const d = p.data;
  if (!d.types || Object.keys(d.types).length < 8) errors.push('GMS pack: need at least 8 types (they become the gyms)');

// ----- movement -----
let last = performance.now(), acc = 0; const STEP = 1 / 30;

  if (state.held.n) dn += 1; if (state.held.s) dn -= 1; if (state.held.e) de += 1; if (state.held.w) de -= 1;
  if (!dn && !de) return;
  const len = Math.hypot(dn, de); dn /= len; de /= len;
  moveTo(state.lat + (dn * mps * dt) / 111320, state.lon + (de * mps * dt) / (111320 * Math.cos(state.lat * Math.PI / 180)));
}

  if (countWalk) { state.odometerM += d; if (state.save && addWalk(state.save, d)) persistSave(); }
  state.lat = lat; state.lon = lon;
  osmRefresh(false);
}

// ----- live GPS -----
// Filters: fixes worse than 60 m are ignored; a jump implying > 60 m/s (216 km/h) is dropped as a glitch.
// Position always follows plausible fixes (car, bus, train); walking credit (odometer, snare refill) only accrues below 7 m/s.

function gpsStart(fromGesture) {
  if (!navigator.geolocation) { flash('Geolocation API unavailable in this context.'); return; }
  state.gps.on = true; state.gps.err = null; state.gps.at = 0; updateGpsBtn();
  state.gps.watchId = navigator.geolocation.watchPosition(p => {
    const { latitude: lat, longitude: lon, accuracy } = p.coords, t = p.timestamp || Date.now();
    state.gps.acc = accuracy; state.gps.at = t;
    if (accuracy > 60) return;
    let speed = 0;
    if (lastFix) { const dist = haversineM(lastFix.lat, lastFix.lon, lat, lon), dtS = Math.max(0.5, (t - lastFix.t) / 1000); speed = dist / dtS; if (speed > 60) return; }

    if (first) { state.lat = lat; state.lon = lon; if (osm.map) osm.map.setView([lat, lon], 16); } else moveTo(lat, lon, speed <= 7);

  const key = [Math.floor(b.getSouth() / WORLD.LAT_STEP), Math.floor(b.getWest() / WORLD.LON_STEP), Math.ceil(b.getNorth() / WORLD.LAT_STEP), Math.ceil(b.getEast() / WORLD.LON_STEP), z, d.rx, d.ry, state.squares, PACK.meta.name, badgeCount(state.save || newSave())].join('|');

  state.save = migrateSave(raw) || newSave();
  // anything from another pack is quarantined to the box rather than crashing battles
  const known = m => PACK.speciesById.has(m.speciesId);
  const foreign = state.save.team.filter(m => !known(m)); if (foreign.length) { state.save.team = state.save.team.filter(known); state.save.box.push(...foreign); }
  [...state.save.team, ...state.save.box].forEach(m => { if (known(m)) hydrate(m); });
  if (!state.save.team.length) state.save.starterChosen = false;
}

  const files = Array.from(packInput.files || []); packInput.value = '';
  const base = f => (f.webkitRelativePath || f.name).split('/').pop();
  const bin = files.find(f => f.name.toLowerCase().endsWith('.bin'));
  if (bin) { const text = await bin.text(); try { const raw = parseGmsBin(text); applyPack(raw, new Map()); await savePack(raw, new Map(), 'gms'); flash('Loaded GMS pack "' + PACK.meta.name + '".'); } catch (e) { flash('Could not read .bin: ' + e.message); } return; }
  const jsonFile = files.find(f => base(f).toLowerCase() === 'pack.json') || files.find(f => f.name.toLowerCase().endsWith('.json'));
  if (!jsonFile) { flash('No pack.json or .bin in the selection.'); return; }
  let pack; try { pack = JSON.parse(await jsonFile.text()); } catch (e) { flash('pack.json is not valid JSON: ' + e.message); return; }
  const v = validatePack(pack); if (!v.ok) { alert('Pack rejected:\n• ' + v.errors.slice(0, 12).join('\n• ')); return; }
  const blobs = new Map(files.filter(f => /\.(png|jpe?g|gif|webp|svg)$/i.test(f.name)).map(f => [base(f), f]));
  applyPack(pack, blobs); await savePack(pack, blobs, 'scouter');
  const missing = pack.species.filter(s => s.sprite && !blobs.has(s.sprite)).length;
  flash('Loaded "' + pack.name + '": ' + pack.families.length + ' families, ' + pack.species.length + ' species, ' + blobs.size + ' sprites' + (missing ? ' (' + missing + ' referenced sprites not found)' : '') + '.');
});
function applyPack(pack, blobs) {
  setPack(pack);
  sprites.forEach(u => URL.revokeObjectURL(u)); sprites.clear();
  blobs.forEach((blob, name) => sprites.set(name, URL.createObjectURL(blob)));
  loadSave();
  document.getElementById('packName').textContent = PACK.meta.name + (PACK.meta.version ? ' v' + PACK.meta.version : '') + ' · ' + PACK.mode + ' battles';
  state.battle = null; renderTeam(); osm.lastKey = ''; osmRefresh(true);
  if (!state.save.starterChosen) offerStarter();
}
function idb() { return new Promise(res => { try { if (!window.indexedDB) return res(null); const req = indexedDB.open('scouter-packs', 1); req.onupgradeneeded = () => req.result.createObjectStore('kv'); req.onsuccess = () => res(req.result); req.onerror = () => res(null); } catch (e) { res(null); } }); }
async function savePack(pack, blobs, kind) { const db = await idb(); if (!db) return; try { const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv'); st.put(kind === 'gms' ? JSON.stringify(pack) : pack, 'pack'); st.put(kind, 'kind'); st.put(Object.fromEntries(blobs), 'sprites'); await new Promise((r, j) => { tx.oncomplete = r; tx.onerror = () => j(tx.error); }); } catch (e) { console.warn('pack not persisted:', e.message); } }
async function restorePack() {
  const db = await idb(); if (!db) return;
  try {
    const tx = db.transaction('kv', 'readonly'), st = tx.objectStore('kv');
    const get = k => new Promise(r => { const q = st.get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); });
    let pack = await get('pack'); const kind = await get('kind'), spr = await get('sprites');
    if (typeof pack === 'string') pack = JSON.parse(pack);
    if (pack && (kind === 'gms' ? validateGmsPack(pack).ok : validatePack(pack).ok)) applyPack(pack, new Map(Object.entries(spr || {})));
  } catch (e) { console.warn('pack not restored:', e.message); }
}

loadSave();
osmInit();
setView(osm.ok ? 'map' : 'grid');
fitCanvas();
updateGpsBtn();
requestAnimationFrame(tick);
restorePack().then(() => { renderTeam(); if (!state.save.starterChosen) offerStarter(); if (navigator.geolocation && !state.sim) gpsStart(false); });
</script>
